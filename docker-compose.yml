version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aibot
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: aibot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A celery_worker.celery_app worker -l info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  beat:
    build: .
    command: celery -A celery_worker.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  pgdata: